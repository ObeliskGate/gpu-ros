build:
  merge-install: true
  base-paths:
    - src/gpu_ros_managed/gpu_ros_managed_core
    - src/gpu_ros_managed/gpu_ros_managed_cuda
    - src/gpu_ros_managed/gpu_ros_managed_hip
    - src/gpu_ros_managed/gpu_ros_managed_ros
    - migrated_packages/isaac_ros_detection_validation
  cmake-args:
    - --no-warn-unused-cli
    - -DCMAKE_BUILD_TYPE=Release
    - -DBUILD_NITROS_TRANSPORT=OFF
    - -DORT_ENABLE_CUDA=OFF
    - -DORT_ENABLE_ROCM=OFF
    - -DORT_ENABLE_MIGRAPHX=ON
    - -DBUILD_MANAGED_HIP_TRANSPORT=ON
    - -DGPU_ROS_MANAGED_HIP_REQUIRE_SDK=ON
    - -DBUILD_MIGRAPHX_POL_TEST=ON
    - -DBUILD_NVIDIA_YOLOV8_POL_TEST=OFF
    - -DBUILD_YOLOV8_MIGRAPHX_POL_TEST=OFF
    - -DBUILD_TESTING=ON
  symlink-install: true
test:
  merge-install: true
  # The legacy NVIDIA YOLOv8 POL imports isaac_ros_test and is not part of
  # the AMD test matrix. Keep this exclusion effective even for a workspace
  # whose CMake cache was configured before the AMD option was set to OFF.
  ctest-args:
    - -E
    - test_isaac_ros_std_yolov8_pol_test
  base-paths:
    - src/gpu_ros_managed/gpu_ros_managed_core
    - src/gpu_ros_managed/gpu_ros_managed_hip
    - src/gpu_ros_managed/gpu_ros_managed_ros
    - migrated_packages/isaac_ros_detection_validation
  packages-select:
    - gpu_ros_managed_core
    - gpu_ros_managed_hip
    - gpu_ros_managed_ros
    - isaac_ros_detection_validation
