services:
  dev:
    build: .
    network_mode: host
    # The NVIDIA reference profile uses CUDA, NITROS, and TensorRT-backed
    # upstream components.  Device reservations alone can leave an existing
    # Compose container on runc without the NVIDIA driver hook.
    runtime: nvidia
    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      ROS2_BENCHMARK_OVERRIDE_ASSETS_ROOT: /workspaces/isaac_ros-dev/assets
      COLCON_DEFAULTS_FILE: /workspaces/isaac_ros-dev/src/amd_ros_object_detection/docker/colcon-defaults-phase2b-nvidia.yaml
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    volumes:
      - .:/workspaces/isaac_ros-dev/src/amd_ros_object_detection
      - ${GPU_ROS_MANAGED_DIR:-../gpu_ros_managed}:/workspaces/isaac_ros-dev/src/gpu_ros_managed:ro
      - assets:/workspaces/isaac_ros-dev/assets
    working_dir: /workspaces/isaac_ros-dev

volumes:
  assets:
