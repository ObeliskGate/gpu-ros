name: CPU Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  transport-core:
    name: transport-core
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build and test transport core
        run: |
          cmake -S gpu_ros_managed -B "${RUNNER_TEMP}/gpu-ros-transport-core" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_DISABLE_FIND_PACKAGE_ament_cmake=TRUE \
            -DBUILD_TESTING=ON \
            -DGPU_ROS_MANAGED_BUILD_TESTING=ON \
            -DGPU_ROS_MANAGED_BUILD_CUDA=OFF \
            -DGPU_ROS_MANAGED_BUILD_HIP=OFF
          cmake --build "${RUNNER_TEMP}/gpu-ros-transport-core" --parallel 2
          ctest --test-dir "${RUNNER_TEMP}/gpu-ros-transport-core" \
            --output-on-failure --no-tests=error
          cmake --install "${RUNNER_TEMP}/gpu-ros-transport-core" \
            --prefix "${RUNNER_TEMP}/gpu-ros-transport-core-install"
          cmake -S gpu_ros_managed/gpu_ros_managed_core/test/standalone_consumer \
            -B "${RUNNER_TEMP}/gpu-ros-transport-core-consumer" \
            -Dgpu_ros_managed_core_DIR="${RUNNER_TEMP}/gpu-ros-transport-core-install/share/gpu_ros_managed_core/cmake"
          cmake --build "${RUNNER_TEMP}/gpu-ros-transport-core-consumer" --parallel 2
          LD_LIBRARY_PATH="${RUNNER_TEMP}/gpu-ros-transport-core-install/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            "${RUNNER_TEMP}/gpu-ros-transport-core-consumer/consumer"

  python-tools:
    name: python-tools
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ROCPROF_RUN_FULL_TRACE_REGRESSION: '0'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.11.29'
          enable-cache: false
      - name: Check namespace boundaries
        run: |
          uv run --no-project --isolated --python 3.12 \
            python tools/test_open_source_namespace_boundaries.py
      - name: Run CPU Python tests
        run: |
          uv run --no-project --isolated --python 3.12 \
            --with pytest==9.0.3 \
            python -m pytest -q -p no:cacheprovider \
            gpu_ros_object_detection/tools/test_lyrical_package_lock.py \
            gpu_ros_object_detection/gpu_ros_onnx_inference/test/test_onnxruntime_configure.py \
            gpu_ros_object_detection/gpu_ros_onnx_inference/test/test_summarize_ort_profile.py \
            gpu_ros_object_detection/gpu_ros_onnx_inference/test/test_compare_nsys_cuda_traces.py \
            gpu_ros_object_detection/gpu_ros_onnx_inference/test/test_compare_nvidia_copy_traces.py \
            gpu_ros_object_detection/gpu_ros_onnx_inference/test/test_analyze_rocprof_traces.py \
            gpu_ros_object_detection/gpu_ros_detection_validation/test/test_capture_runner.py

  ros-lyrical-cpu:
    name: ros-lyrical-cpu
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ROS_DISTRO: lyrical
      GPU_ROS_NVIDIA_PROFILE: '0'
      ISAAC_ROS_BASE_IMAGE: ${{ vars.ISAAC_ROS_BASE_IMAGE }}
      ROS_LYRICAL_APT_PACKAGE_SPECS: ${{ vars.ROS_LYRICAL_APT_PACKAGE_SPECS }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Require image-matched ROS package lock
        run: |
          bash gpu_ros_object_detection/docker/install_isaac_ros_apt_packages.sh --check-inputs
      - name: Install ROS Lyrical CPU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl gnupg python3 \
            build-essential cmake libopencv-dev \
            python3-numpy python3-pytest
          sudo env \
            ROS_DISTRO="${ROS_DISTRO}" \
            ISAAC_ROS_BASE_IMAGE="${ISAAC_ROS_BASE_IMAGE}" \
            ROS_LYRICAL_APT_PACKAGE_SPECS="${ROS_LYRICAL_APT_PACKAGE_SPECS}" \
            bash gpu_ros_object_detection/docker/install_isaac_ros_apt_packages.sh
      - name: Build and test ROS Lyrical CPU packages
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/lyrical/setup.bash
          packages=(
            gpu_ros_managed/gpu_ros_managed_core
            gpu_ros_managed/gpu_ros_managed_hip
            gpu_ros_managed/gpu_ros_managed_ros
            gpu_ros_managed/gpu_ros_tensor_bundle_msgs
            gpu_ros_managed/gpu_ros_rosidl_buffer
            gpu_ros_managed/gpu_ros_managed_tensor_bundle
            gpu_ros_object_detection/gpu_ros_detection_common
            gpu_ros_object_detection/gpu_ros_rtdetr
            gpu_ros_object_detection/gpu_ros_yolov8
          )
          colcon build --base-paths "${packages[@]}" --cmake-args \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_hip=TRUE \
            -DGPU_ROS_ROSIDL_BUFFER_BUILD_CUDA=OFF \
            -DBUILD_NATIVE_TENSOR_LIST_TRANSPORT=OFF \
            -DBUILD_MIGRAPHX_POL_TEST=OFF \
            -DBUILD_NVIDIA_YOLOV8_POL_TEST=OFF \
            -DBUILD_YOLOV8_MIGRAPHX_POL_TEST=OFF
          source install/setup.bash
          colcon test --base-paths "${packages[@]}"
          colcon test-result --all --verbose
          /usr/bin/python3 -m pytest -q -p no:cacheprovider \
            gpu_ros_object_detection/gpu_ros_detection_validation/test/test_compare_detection2d_bags.py
