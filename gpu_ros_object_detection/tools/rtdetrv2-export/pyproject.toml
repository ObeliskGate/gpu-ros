[project]
name = "ovg-rtdetrv2-export"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==1.26.4",
  "onnx==1.16.2",
  "onnxruntime==1.23.1",
  "pycocotools==2.0.8",
  "pyyaml==6.0.2",
  "scipy==1.12.0",
  "tensorboard==2.17.1",
  "torch==2.2.2",
  "torchvision==0.17.2",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{index = "pytorch-cpu"}]
torchvision = [{index = "pytorch-cpu"}]
