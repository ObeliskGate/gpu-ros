services:
  dev:
    build:
      context: ../..
      dockerfile: gpu_ros_object_detection/docker/Dockerfile
      args:
        ISAAC_ROS_BASE_IMAGE: ${ISAAC_ROS_BASE_IMAGE:-}
    network_mode: host
    # The NVIDIA reference profile uses native TensorList Buffer transport and
    # TensorRT-backed upstream components. Device reservations alone can leave
    # an existing Compose container on runc without the NVIDIA driver hook.
    runtime: nvidia
    stdin_open: true
    tty: true
    environment:
      ROS_DISTRO: lyrical
      GPU_ROS_NVIDIA_PROFILE: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      ROS2_BENCHMARK_OVERRIDE_ASSETS_ROOT: /workspaces/isaac_ros-dev/assets
      GPU_ROS_REPO_ROOT: /workspaces/isaac_ros-dev/src/gpu-ros
      COLCON_DEFAULTS_FILE: /workspaces/isaac_ros-dev/src/gpu-ros/gpu_ros_object_detection/docker/colcon-defaults-phase2b-nvidia.yaml
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    volumes:
      - ../..:/workspaces/isaac_ros-dev/src/gpu-ros
      - assets:/workspaces/isaac_ros-dev/assets
    working_dir: /workspaces/isaac_ros-dev

volumes:
  assets:
