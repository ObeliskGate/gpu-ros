services:
  amd:
    build:
      context: .
      dockerfile: docker/phase2a-amd.Dockerfile
      args:
        AMD_BASE_IMAGE: ${AMD_BASE_IMAGE:-rocm/dev-ubuntu-24.04:7.1.1-complete}
        ORT_VERSION: ${ORT_VERSION:-1.23.1}
        ORT_BUILD_JOBS: ${ORT_BUILD_JOBS:-16}
        AMD_GPU_TARGETS: ${AMD_GPU_TARGETS:-gfx942}
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
        INSTALL_BENCHMARK_DEPS: ${INSTALL_BENCHMARK_DEPS:-0}
    network_mode: host
    ipc: host
    shm_size: 8gb
    stdin_open: true
    tty: true
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    security_opt:
      - seccomp=unconfined
    environment:
      ROS_DISTRO: ${ROS_DISTRO:-jazzy}
      ONNXRUNTIME_ROOT: /opt/onnxruntime
      ONNXRUNTIME_INCLUDE_DIR: /opt/onnxruntime/include
      ONNXRUNTIME_LIBRARY: /opt/onnxruntime/lib/libonnxruntime.so
      COLCON_DEFAULTS_FILE: /workspaces/amd_ros_object_detection/docker/colcon-defaults-phase2a-amd.yaml
      ROS2_BENCHMARK_OVERRIDE_ASSETS_ROOT: /workspaces/isaac_ros-dev/assets
    volumes:
      - .:/workspaces/amd_ros_object_detection
      - assets:/workspaces/isaac_ros-dev/assets
      - phase2a_build:/workspaces/amd_ros_object_detection/build
      - phase2a_install:/workspaces/amd_ros_object_detection/install
      - phase2a_log:/workspaces/amd_ros_object_detection/log
    working_dir: /workspaces/amd_ros_object_detection

volumes:
  assets:
  phase2a_build:
  phase2a_install:
  phase2a_log:
